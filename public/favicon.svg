<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="favHex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="35%" stop-color="#3b82f6" />
      <stop offset="70%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="favCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <!-- Background Shield -->
  <polygon
    points="64,8 114,36 114,92 64,120 14,92 14,36"
    fill="#0a0d15"
    stroke="url(#favHex)"
    stroke-width="5"
    stroke-linejoin="round"
  />

  <!-- Internal Connectors -->
  <line x1="64" y1="30" x2="64" y2="98" stroke="#3b82f6" stroke-width="2.5" />
  <line x1="30" y1="64" x2="98" y2="64" stroke="#10b981" stroke-width="2.5" />

  <!-- Central Diamond Core -->
  <polygon points="64,52 76,64 64,76 52,64" fill="url(#favCore)" />
  <circle cx="64" cy="64" r="3.5" fill="#ffffff" />

  <!-- 4 AI Nodes -->
  <circle cx="64" cy="30" r="7" fill="#06b6d4" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="98" cy="64" r="7" fill="#10a37f" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="64" cy="98" r="7" fill="#3b82f6" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="30" cy="64" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5" />
</svg>
